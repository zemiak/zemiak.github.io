<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Radio</title>
<style>
  :root {
    --bg: #111317;
    --tile: #ffffff;
    --accent: #ff3b5c;
    --text: #e8e9ec;
    --muted: #8a8f99;
    --gap: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 16px) max(env(safe-area-inset-right), 16px)
             max(env(safe-area-inset-bottom), 12px) max(env(safe-area-inset-left), 16px);
  }
  #grid {
    flex: 1; min-height: 0;
    display: grid; gap: var(--gap);
    align-content: center; justify-content: center;
  }
  .station {
    position: relative; padding: 0; border: 0; cursor: pointer;
    width: var(--size); height: var(--size);
    border-radius: 22%;
    background: var(--tile);
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    overflow: hidden;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .station:active { transform: scale(.95); }
  .station img {
    position: absolute; inset: 12%;
    width: 76%; height: 76%;
    object-fit: contain;
    transition: filter .25s ease, opacity .25s ease;
  }
  .station .fallback {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #222; font-weight: 700; font-size: calc(var(--size) * .14);
    text-align: center; padding: 10%;
  }
  .station .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(10,10,14,.45);
    opacity: 0; transition: opacity .25s ease;
  }
  .station.playing, .station.loading {
    box-shadow: 0 0 0 3px var(--accent), 0 6px 22px rgba(255,59,92,.45);
  }
  .station.playing .overlay, .station.loading .overlay, .station.error .overlay { opacity: 1; }
  .station.playing img, .station.loading img { filter: blur(1px); opacity: .8; }

  /* equalizer indicator */
  .eq { display: none; gap: 7%; align-items: flex-end; width: 34%; height: 34%; }
  .eq span {
    flex: 1; background: #fff; border-radius: 3px; height: 30%;
    animation: eq 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(2) { animation-delay: -.3s; animation-duration: .7s; }
  .eq span:nth-child(3) { animation-delay: -.6s; animation-duration: 1.1s; }
  .eq span:nth-child(4) { animation-delay: -.15s; animation-duration: .8s; }
  @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }
  .station.playing .eq { display: flex; }

  /* loading spinner */
  .spin {
    display: none; width: 34%; height: 34%;
    border: calc(var(--size) * .035) solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .station.loading .spin { display: block; }

  /* error mark */
  .err { display: none; color: #fff; font-weight: 800; font-size: calc(var(--size) * .3); }
  .station.error .err { display: block; }

  #status {
    flex: none; text-align: center; min-height: 1.3em; margin-top: 10px;
    color: var(--muted); font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status b { color: var(--text); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; height: 70%; }
    .eq span:nth-child(2n) { height: 45%; }
  }
</style>
</head>
<body>
<main id="grid" aria-label="Stations"></main>
<div id="status" role="status" aria-live="polite"></div>
<audio id="audio" preload="none"></audio>

<script>
(() => {
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  const audio = document.getElementById('audio');
  let stations = [];
  let current = null;   // index of selected station
  let buttons = [];

  // --- layout: choose column count so all tiles fit on one screen, as big as possible
  function layout() {
    const n = buttons.length;
    if (!n) return;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'));
    const W = grid.clientWidth, H = grid.clientHeight;
    let best = { size: 0, cols: 1 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const size = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows);
      if (size > best.size) best = { size, cols };
    }
    const size = Math.floor(Math.min(best.size, 260));
    grid.style.setProperty('--size', size + 'px');
    grid.style.gridTemplateColumns = `repeat(${best.cols}, ${size}px)`;
  }

  function setState(i, state) {
    buttons.forEach((b, j) => {
      b.classList.remove('playing', 'loading', 'error');
      b.setAttribute('aria-pressed', 'false');
      if (j === i && state) {
        b.classList.add(state);
        b.setAttribute('aria-pressed', 'true');
      }
    });
    const name = i != null ? stations[i].name : '';
    status.innerHTML =
      state === 'playing' ? `▶ <b>${esc(name)}</b>` :
      state === 'loading' ? `Loading <b>${esc(name)}</b>…` :
      state === 'error'   ? `<b>${esc(name)}</b> – stream not available` : '';
  }

  function stop() {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();             // closes the network connection
    current = null;
    setState(null);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
  }

  function play(i) {
    current = i;
    const s = stations[i];
    setState(i, 'loading');
    audio.src = s.url;
    audio.play().catch(err => {
      if (current === i && err.name !== 'AbortError') setState(i, 'error');
    });
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.name, artist: 'Live',
        artwork: s.artwork ? [{ src: s.artwork, sizes: '512x512' }] : []
      });
    }
  }

  function toggle(i) {
    if (current === i) stop(); else play(i);
  }

  audio.addEventListener('playing', () => current != null && setState(current, 'playing'));
  audio.addEventListener('waiting', () => current != null && setState(current, 'loading'));
  audio.addEventListener('error', () => current != null && audio.getAttribute('src') && setState(current, 'error'));

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => current != null && audio.play());
    navigator.mediaSession.setActionHandler('pause', stop);
    navigator.mediaSession.setActionHandler('stop', stop);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function render() {
    grid.innerHTML = '';
    buttons = stations.map((s, i) => {
      const b = document.createElement('button');
      b.className = 'station';
      b.title = s.name;
      b.setAttribute('aria-label', s.name);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `
        <div class="overlay">
          <div class="eq"><span></span><span></span><span></span><span></span></div>
          <div class="spin"></div>
          <div class="err">!</div>
        </div>`;
      if (s.artwork) {
        const img = new Image();
        img.alt = '';
        img.src = s.artwork;
        img.onerror = () => { img.replaceWith(fallback(s.name)); };
        b.prepend(img);
      } else {
        b.prepend(fallback(s.name));
      }
      b.addEventListener('click', () => toggle(i));
      grid.appendChild(b);
      return b;
    });
    layout();
  }

  function fallback(name) {
    const d = document.createElement('div');
    d.className = 'fallback';
    d.textContent = name;
    return d;
  }

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));

  fetch('config.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(cfg => {
      stations = (cfg.streams || []).filter(s => s && s.url);
      render();
    })
    .catch(e => { status.textContent = 'Cannot read config.json (' + e.message + ')'; });
})();
</script>
</body>
</html>
